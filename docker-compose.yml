version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ayuntaweb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ayuntaweb
      POSTGRES_USER: ayuntaweb
      POSTGRES_PASSWORD: ayuntaweb_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayuntaweb -d ayuntaweb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ayuntaweb-network

  # Opcional: pgAdmin para gestionar la base de datos visualmente
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ayuntaweb-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ayuntaweb.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ayuntaweb-network

volumes:
  postgres_data:
    name: ayuntaweb_postgres_data

networks:
  ayuntaweb-network:
    name: ayuntaweb-network
    driver: bridge